[package]
name = "pi-jingle-server"
version = "0.1.0"
edition = "2021"
description = "Receiver server for pi-jingle remote event notifications"
build = "build.rs"

[features]
default = ["desktop"]
# Tauri desktop window (agent task board UI). Disable with
# `cargo build --no-default-features` to build the headless receiver only.
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rodio = "0.20"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `tray-icon` gives the program a tray icon. The task board window has no
# taskbar entry, so the tray icon is the only taskbar-area entry point.
# `image-png` decodes the embedded PNG icon.
tauri = { version = "2.12", optional = true, features = ["tray-icon", "image-png"] }

[build-dependencies]
tauri-build = { version = "2.7", optional = true }
